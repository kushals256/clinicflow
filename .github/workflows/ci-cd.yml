name: ClinicFlow CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Test - Backend and Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Run backend tests
        run: pytest -q
        working-directory: backend

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build frontend
        run: npm install && npm run build
        working-directory: frontend

  build-scan-push:
    name: Build, Trivy Scan, Push to GHCR
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image owner
        id: meta
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        run: |
          docker build -t ghcr.io/${{ steps.meta.outputs.owner }}/clinicflow-backend:${{ github.sha }} ./backend

      - name: Build frontend image
        run: |
          docker build -t ghcr.io/${{ steps.meta.outputs.owner }}/clinicflow-frontend:${{ github.sha }} ./frontend

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update && sudo apt-get install -y trivy

      - name: Scan backend image
        run: |
          trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            ghcr.io/${{ steps.meta.outputs.owner }}/clinicflow-backend:${{ github.sha }}

      - name: Scan frontend image
        run: |
          trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            ghcr.io/${{ steps.meta.outputs.owner }}/clinicflow-frontend:${{ github.sha }}

      - name: Push images to GHCR
        run: |
          docker push ghcr.io/${{ steps.meta.outputs.owner }}/clinicflow-backend:${{ github.sha }}
          docker push ghcr.io/${{ steps.meta.outputs.owner }}/clinicflow-frontend:${{ github.sha }}
