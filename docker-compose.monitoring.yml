# Local observability for M9 screenshots (no AWS required).
# Usage (with app already up):
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d prometheus grafana
# UI:
#   Prometheus  http://localhost:9091
#   Grafana     http://localhost:3300  (admin / clinicflow)

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus-local.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9091:9090"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: clinicflow
      GF_USERS_DEFAULT_THEME: dark
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
    volumes:
      - ./monitoring/grafana-provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/clinicflow-dashboard.json:/var/lib/grafana/dashboards/clinicflow.json:ro
    ports:
      - "3300:3000"
    depends_on:
      - prometheus
