apiVersion: v1
kind: Service
metadata:
  name: clinicflow-backend
  labels:
    app: clinicflow-backend
spec:
  type: ClusterIP
  selector:
    app: clinicflow-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
# Alias for frontend nginx.conf (proxy_pass http://backend:8000)
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app: clinicflow-backend
spec:
  type: ClusterIP
  selector:
    app: clinicflow-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
