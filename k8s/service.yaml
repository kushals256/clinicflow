apiVersion: v1
kind: Service
metadata:
  name: clinicflow-backend
  namespace: clinicflow
spec:
  selector:
    app: clinicflow-backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: clinicflow-frontend
  namespace: clinicflow
spec:
  selector:
    app: clinicflow-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
