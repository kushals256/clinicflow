apiVersion: v1
kind: ConfigMap
metadata:
  name: clinicflow-grafana-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  clinicflow-dashboard.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "panels": [
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "id": 1,
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom" },
            "tooltip": { "mode": "single" }
          },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{job=~\".*clinicflow.*|.*backend.*\"}[5m])) or sum(rate(http_request_duration_seconds_count[5m]))",
              "legendFormat": "HTTP requests / sec",
              "refId": "A"
            }
          ],
          "title": "ClinicFlow HTTP Request Rate",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "id": 2,
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le))",
              "legendFormat": "p95 latency",
              "refId": "A"
            }
          ],
          "title": "ClinicFlow p95 Latency",
          "type": "timeseries"
        }
      ],
      "refresh": "10s",
      "schemaVersion": 39,
      "tags": ["clinicflow"],
      "templating": { "list": [] },
      "time": { "from": "now-15m", "to": "now" },
      "title": "ClinicFlow Application",
      "uid": "clinicflow-app",
      "version": 1
    }
