apiVersion: apps/v1
kind: Deployment
metadata:
  name: clinicflow-broken-image
  namespace: clinicflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clinicflow-broken-image
  template:
    metadata:
      labels:
        app: clinicflow-broken-image
    spec:
      containers:
        - name: backend
          image: ghcr.io/example/clinicflow-backend:this-tag-does-not-exist
          ports:
            - containerPort: 8000
